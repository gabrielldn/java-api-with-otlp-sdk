spring.application.name=java-api-with-otlp-sdk
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
server.port=${SERVER_PORT:8080}
management.server.port=${MANAGEMENT_SERVER_PORT:${server.port}}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.prometheus.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,300ms,500ms,1s,2s,5s

management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.tracing.transport=http
management.otlp.metrics.export.url=${OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
management.otlp.metrics.export.enabled=true
management.otlp.logging.endpoint=${OTLP_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
management.otlp.logging.transport=http
management.otlp.logging.export.enabled=true
management.opentelemetry.resource-attributes.service.name=${spring.application.name}
management.opentelemetry.resource-attributes.deployment.environment=${APP_ENV:local}
management.opentelemetry.resource-attributes.service.version=${APP_VERSION:0.0.1-SNAPSHOT}
management.opentelemetry.resource-attributes.service.instance.id=${APP_INSTANCE_ID:${HOSTNAME:${random.uuid}}}

springdoc.api-docs.path=/api/v1/api-docs
springdoc.swagger-ui.path=/api/v1/swagger-ui
springdoc.swagger-ui.url=/api/v1/api-docs
